name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test
        run: .\gradlew.bat test build --no-daemon --console=plain

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetra-insight-${{ github.sha }}
          path: build/libs/tetra_insight-*.jar
          if-no-files-found: error
